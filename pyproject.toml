[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-api"
version = "0.1.0"
description = "REST API for collaborative project and task management"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1,<2.0",
  "asyncpg>=0.32.0",
  "email-validator>=2.4.0",
  "fastapi>=0.165.0,<1.0",
  "pwdlib[argon2]>=0.4.2",
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "pyjwt>=2.10,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.54.0,<1.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
